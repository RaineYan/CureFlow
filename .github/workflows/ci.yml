name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Test current product paths
        run: >-
          python -m pytest -q
          tests/test_analysis_tools.py
          tests/test_server.py
          tests/test_xlsx_upload.py
          tests/test_interpretation_review.py
          tests/test_selective_interpretation.py
          tests/test_customer_provider_keys.py
          tests/test_local_provider_setup.py
          tests/test_key_store.py
          tests/test_key_store_routes.py
          tests/test_desktop_health_contract.py
          tests/test_desktop_build.py
      - name: Test desktop logic
        run: npm run test:ui-logic
        working-directory: desktop
      - name: Build desktop UI
        run: npm run build
        working-directory: desktop
